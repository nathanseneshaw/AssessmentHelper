spring.application.name=assessmenthelper

spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration

app.cors.allowed-origins=http://localhost:3000

spring.datasource.url=jdbc:h2:mem:assessmenthelper-${random.uuid};DB_CLOSE_DELAY=-1
spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:data.sql
server.error.include-message=always

server.servlet.session.cookie.same-site=lax

# Email delivery is disabled by default. Set APP_EMAIL_ENABLED=true and provide
# SMTP settings through environment variables to send real email.
app.email.enabled=${APP_EMAIL_ENABLED:false}
app.email.from=${SMTP_FROM:${SMTP_USERNAME:}}
app.email.test-mode=${APP_EMAIL_TEST_MODE:false}
app.email.test-recipient=${APP_EMAIL_TEST_RECIPIENT:}
spring.mail.host=${SMTP_HOST:}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.ssl.enable=${SMTP_SSL:false}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=3000
spring.mail.properties.mail.smtp.writetimeout=5000
